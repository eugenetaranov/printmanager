name: Provision printmanager server
hosts: [192.168.1.111]
connection: ssh
sudo: true

ssh:
  user: e
  port: 22
  key: ~/.ssh/identities/local_servers/default

roles:
  # Order matters: base sets up the firewall + common packages; scan-share
  # creates the scan directory and group that scan-server writes into; web-ui
  # runs last because it shells out to scan-server's pipeline and print-server's
  # CUPS queue. watchdog is independent (self-healing) and runs right after base.
  - role: base
    tags: [base]
  - role: watchdog
    tags: [watchdog]
  - role: print-server
    tags: [print]
  - role: scan-share
    tags: [scan, share]
  - role: scan-server
    tags: [scan]
  - role: web-ui
    tags: [web]

