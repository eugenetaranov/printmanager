name: Provision printmanager server
hosts: [192.168.1.111]
connection: ssh
sudo: true

ssh:
  user: e
  port: 22
  key: ~/.ssh/identities/local_servers/default

roles:
  # Order matters: base sets up the firewall + common packages; scan-share
  # creates the scan directory and group that scan-server writes into; web-ui
  # runs last because it shells out to scan-server's pipeline and print-server's
  # CUPS queue. watchdog is independent (self-healing) and runs right after base.
  - role: base
    tags: [base]
  - role: watchdog
    tags: [watchdog]
  - role: print-server
    tags: [print]
    # This host's printers default to the shipped example (Brother DCP-1511) in
    # roles/print-server/defaults/main.yaml. To run your own hardware, override
    # the list here — one entry per CUPS queue. Uncomment and edit:
    # vars:
    #   print_driver_packages: [printer-driver-brlaser]   # drop for driverless-only
    #   printers:
    #     - name: Office
    #       description: My Printer
    #       location: Home LAN
    #       driver: driverless          # or a driver in print_driver_packages
    #       # ppd: "drv:///brlaser.drv/br1510.ppd"   # only for a named driver
    #       # match: "usb://Brother"     # bind a specific USB device; omit ⇒ first usb://
    #       default: true
  - role: scan-share
    tags: [scan, share]
  - role: scan-server
    tags: [scan]
  - role: web-ui
    tags: [web]

