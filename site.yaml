name: Provision printmanager server
hosts: [192.168.0.29]
connection: ssh
sudo: true

ssh:
  user: e
  port: 22
  key: ~/.ssh/identities/local_servers/default

# Host overrides. Every role reads these (Tack merges role defaults and vars
# play-wide; see README "Settings shared between roles"). This host's printers
# default to the shipped example (Brother DCP-1511) in
# roles/print-server/defaults/main.yaml. To run your own hardware, override the
# list — one entry per CUPS queue; the web UI prints to the `default: true` one.
# Uncomment and edit:
# vars:
#   print_driver_packages: [printer-driver-brlaser]   # drop for driverless-only
#   printers:
#     - name: Office
#       description: My Printer
#       location: Home LAN
#       driver: driverless          # or a driver in print_driver_packages
#       # ppd: "drv:///brlaser.drv/br1510.ppd"   # only for a named driver
#       # match: "usb://Brother"     # bind a specific USB device; omit ⇒ first usb://
#       default: true
#   scan_backend: escl              # driverless scanner instead of brscan4-emu

roles:
  # Order matters: base sets up the firewall + common packages; scan-share
  # creates the scan directory and group that scan-server writes into; web-ui
  # runs last because it shells out to scan-server's pipeline and print-server's
  # CUPS queue. watchdog is independent (self-healing) and runs right after base.
  # preflight only validates shared settings (no changes), so it runs first and
  # on every --tags run.
  - role: preflight
    tags: [always]
  - role: base
    tags: [base]
  - role: watchdog
    tags: [watchdog]
  - role: print-server
    tags: [print]
  - role: scan-share
    tags: [scan, share]
  - role: scan-server
    tags: [scan]
  - role: web-ui
    tags: [web]

