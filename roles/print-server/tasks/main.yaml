# Network print server: CUPS shared to the LAN and advertised over Avahi/mDNS
# (AirPrint). Provisions one queue per entry in `printers:` — each either
# driverless (IPP Everywhere) or a named driver/PPD — so adding a printer of any
# brand is a config edit, not a role edit.
#
# Overridable variables: see defaults/main.yaml. Depends on `base` for the
# firewall baseline.

- name: Install CUPS, Avahi, and driverless helpers
  apt:
    name: "{{ print_packages }}"
    state: present
    update_cache: true

# Vendor drivers for the configured printers (none needed for driverless-only
# hosts). Skipped when the list is empty.
- name: Install printer driver packages
  apt:
    name: "{{ print_driver_packages }}"
    state: present
  when: print_driver_packages

- name: Configure CUPS to listen on the LAN and share printers
  template:
    src: cupsd.conf.j2
    dest: /etc/cups/cupsd.conf
    mode: "0640"
  notify: Restart CUPS

- name: Ensure CUPS and Avahi are running and enabled
  systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - cups
    - avahi-daemon

# The printer list is baked into this script at render time (one queue-setup
# call per entry), so we run it ONCE rather than looping the task over printers —
# a tack task loop would deliver templated per-printer values unrendered.
- name: Install the printer-queue setup helper
  template:
    src: setup-printers.sh.j2
    dest: /usr/local/sbin/setup-printers.sh
    mode: "0755"

# Creates/updates each configured queue when its printer is connected; a safe
# no-op for any printer that is not (see the helper script). Re-run the play
# after plugging one in to finalize its queue.
- name: Create the shared CUPS queues
  command:
    cmd: /usr/local/sbin/setup-printers.sh

# Two direct tasks rather than a loop: tack renders templates in a single pass,
# so a loop item like "{{ cups_listen_port }}/tcp" would reach iptables unrendered.
# action: insert places these ACCEPTs above the default-deny DROP the base role
# appends to INPUT, regardless of role run order.
- name: Open the firewall for IPP (CUPS) from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ facts.default_ipv4_subnet }}"
    destination_port: "{{ cups_listen_port }}"
    jump: ACCEPT
    action: insert
    comment: "print: cups ipp"
    persist: true

- name: Open the firewall for mDNS from the LAN
  iptables:
    chain: INPUT
    protocol: udp
    source: "{{ facts.default_ipv4_subnet }}"
    destination_port: 5353
    jump: ACCEPT
    action: insert
    comment: "print: mdns"
    persist: true
