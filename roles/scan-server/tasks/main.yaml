# Scan server. Two selectable backends (see defaults/main.yaml):
#   brscan4-emu — Brother's real x86 brscan4 driver under i386 emulation (chroot
#     + saned net bridge + AirSane); the DCP-1510 needs this (no native eSCL).
#   escl — driverless eSCL via sane-airscan; no chroot/qemu/net-bridge/AirSane.
# The web UI (roles/web-ui) scans through the host SANE and drops PDFs into the
# share. Depends on `base` (firewall) and `scan-share` (scan_dir, scan_group,
# scan_web_user must exist).

- name: Install base scan packages (SANE, img2pdf, ImageMagick, ocrmypdf)
  apt:
    name: "{{ scan_packages }}"
    state: present
    update_cache: true

# One data pack per configured OCR language (tesseract-ocr-eng, -ukr, -tur, ...).
- name: Install Tesseract OCR language data
  apt:
    name: "tesseract-ocr-{{ item }}"
    state: present
  loop: "{{ scan_ocr_langs }}"
  when: scan_ocr_enabled

- name: Install the emulation toolchain (brscan4-emu backend)
  apt:
    name: "{{ brscan4_packages }}"
    state: present
  when: scan_brscan4_enabled

- name: Install sane-airscan (eSCL backend)
  apt:
    name: "{{ escl_packages }}"
    state: present
  when: scan_escl_enabled

# --- Brother brscan4 under i386 emulation (brscan4-emu backend) ---------------
- name: Render the brscan4 emulation installer
  template:
    src: install-brscan4-emu.sh.j2
    dest: /usr/local/sbin/install-brscan4-emu.sh
    mode: "0755"
  when: scan_brscan4_enabled

# Builds the i386 chroot (debootstrap) and installs Brother's driver. Slow on
# the first run (~a few minutes); a no-op once the chroot is ready.
- name: Build the brscan4 emulation chroot
  command:
    cmd: /usr/local/sbin/install-brscan4-emu.sh
  when: scan_brscan4_enabled

# --- Scan pipeline (scan-web scans through the host SANE directly) ------------
- name: Create the scan-web / helper directory
  file:
    path: /usr/local/lib/scan-web
    state: directory
    mode: "0755"

# Only the brscan4 net path short-reads the last row; the padder is used by the
# pipeline only on that backend.
- name: Install the PNM padder
  template:
    src: pad_pnm.py.j2
    dest: /usr/local/lib/scan-web/pad_pnm.py
    mode: "0644"
  when: scan_brscan4_enabled

- name: Install the scan-to-share script
  template:
    src: scan-to-share.sh.j2
    dest: /usr/local/lib/scan-web/scan-to-share.sh
    mode: "0755"

# Thumbnails + DPI/mode sidecars for the web UI's table, kept out of the share.
# A command (not the file module) so it's reliably chowned to the scans user.
- name: Create the scan-web data directory (thumbnails + metadata)
  command:
    cmd: "sh -c 'mkdir -p /var/lib/scan-web/thumbs /var/lib/scan-web/meta && chown -R {{ scan_web_user }}:{{ scan_group }} /var/lib/scan-web'"

- name: Install the chroot bind-mount unit
  template:
    src: brscan-mounts.service.j2
    dest: /etc/systemd/system/brscan-mounts.service
    mode: "0644"
  when: scan_brscan4_enabled

- name: Enable the chroot bind mounts
  systemd:
    name: brscan-mounts.service
    state: started
    enabled: true
    daemon_reload: true
  when: scan_brscan4_enabled

# --- AirSane net bridge (chroot saned on localhost:saned_port) ----------------
# Free saned's port from anything that squats it (sane-utils' saned.socket;
# scanbd's scanbm/scanbd sockets; inetd) so our chroot saned can bind it.
- name: Free saned's port (mask units that bind it)
  command:
    cmd: "sh -c 'systemctl mask --now saned.socket saned@.service scanbm.socket scanbd.socket scanbd.service openbsd-inetd inetd 2>/dev/null; true'"
  when: scan_brscan4_enabled

- name: Install the chroot saned socket + service
  template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "brscan-saned.socket.j2", dest: "brscan-saned.socket" }
    - { src: "brscan-saned@.service.j2", dest: "brscan-saned@.service" }
  when: scan_brscan4_enabled

- name: Point host SANE at the chroot saned (net backend only)
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "host-dll.conf.j2", dest: "/etc/sane.d/dll.conf" }
    - { src: "host-net.conf.j2", dest: "/etc/sane.d/net.conf" }
  when: scan_brscan4_enabled

- name: Enable the chroot saned socket
  systemd:
    name: brscan-saned.socket
    state: started
    enabled: true
    daemon_reload: true
  when: scan_brscan4_enabled

# --- AirSane (eSCL/AirScan server) — re-exports the chroot scanner as eSCL -----
# The sane-airscan package drops /etc/sane.d/dll.d/airscan (enabling the airscan
# backend), which discovers AirSane's own eSCL advertisement and causes the
# scanner to be advertised twice over Bonjour. Disable it on the brscan4 path.
- name: Ensure the SANE dll.d directory exists
  file:
    path: /etc/sane.d/dll.d
    state: directory
    mode: "0755"
  when: scan_brscan4_enabled and airsane_enabled

- name: Disable the sane-airscan backend (avoids an eSCL self-advertise loop with AirSane)
  template:
    src: dll-airscan-disabled.j2
    dest: /etc/sane.d/dll.d/airscan
    mode: "0644"
  when: scan_brscan4_enabled and airsane_enabled
  notify: Restart airsaned

- name: Install AirSane build dependencies
  apt:
    name: "{{ airsane_build_packages }}"
    state: present
    update_cache: true
  when: scan_brscan4_enabled and airsane_enabled

- name: Render the AirSane installer
  template:
    src: install-airsane.sh.j2
    dest: /usr/local/sbin/install-airsane.sh
    mode: "0755"
  when: scan_brscan4_enabled and airsane_enabled

- name: Build and install AirSane from source
  command:
    cmd: /usr/local/sbin/install-airsane.sh
  when: scan_brscan4_enabled and airsane_enabled

- name: Ensure AirSane (airsaned) is running and enabled
  systemd:
    name: airsaned
    state: started
    enabled: true
    daemon_reload: true
  when: scan_brscan4_enabled and airsane_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for AirSane (eSCL) from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ facts.default_ipv4_subnet }}"
    destination_port: "{{ airsane_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: airsane escl"
    persist: true
  when: scan_brscan4_enabled and airsane_enabled

# --- Driverless eSCL backend (sane-airscan) ----------------------------------
# The scanner is a native eSCL device — sane-airscan discovers it over mDNS and
# the host SANE reaches it directly. No chroot, no net bridge, no AirSane. Point
# dll.conf at airscan only (fast; skips probing every other backend).
- name: Point host SANE at the airscan (eSCL) backend
  template:
    src: host-dll-escl.conf.j2
    dest: /etc/sane.d/dll.conf
    mode: "0644"
  when: scan_escl_enabled

# --- Retention: hourly cleanup of old scans ----------------------------------
- name: Install the scan cleanup script
  template:
    src: scan-cleanup.sh.j2
    dest: /usr/local/sbin/scan-cleanup.sh
    mode: "0755"
  when: scan_cleanup_enabled

- name: Schedule the hourly scan cleanup
  cron:
    name: scan-cleanup
    job: /usr/local/sbin/scan-cleanup.sh
    minute: "17"
    user: root
    cron_file: /etc/cron.d/scan-cleanup
    state: "{{ 'present' if scan_cleanup_enabled else 'absent' }}"
