# Scan server for the USB Brother DCP-1511: SANE + brscan4, button-triggered
# scan-to-share via scanbd, and network pull scanning via saned.
#
# Overridable variables: see defaults/main.yaml. Depends on `base` (local_subnet,
# ufw) and `scan-share` (scan_dir, scan_group must already exist).

- name: Install SANE tools, ImageMagick, and scanbd
  apt:
    name: "{{ scan_packages }}"
    state: present
    update_cache: true

# --- Brother scanner backend (open-source brscan) ----------------------------
# Brother's proprietary brscan4 is x86-only, so on the Pi (arm64) we build the
# reverse-engineered open-source backend from source (linking current system
# libs). A udev rule grants the saned/scanbd user USB access to the device.
- name: Install brscan build dependencies
  apt:
    name: "{{ brscan_build_packages }}"
    state: present
    update_cache: true

- name: Render the open-source brscan installer
  template:
    src: install-brscan.sh.j2
    dest: /usr/local/sbin/install-brscan.sh
    mode: "0755"

- name: Install the open-source Brother SANE backend
  command:
    cmd: /usr/local/sbin/install-brscan.sh

- name: Install the Brother scanner udev rule (USB access for saned/scanbd)
  template:
    src: 60-brother-scanner.rules.j2
    dest: /etc/udev/rules.d/60-brother-scanner.rules
    mode: "0644"
  notify: Reload udev rules

# Detection log only (never fails the run): lists scanners when the DCP-1511 is
# connected and the backend can open it. Expected empty until plugged in.
- name: Probe for scanners (informational)
  command:
    cmd: "sh -c 'scanimage -L || true'"

# --- Button-triggered scan-to-share (scanbd) ---------------------------------
# The scanbd package ships /etc/scanbd/scanbd.conf and scanner.d/ but not the
# scriptdir our config points at, so create it before dropping the script in.
- name: Ensure the scanbd scripts directory exists
  file:
    path: /etc/scanbd/scripts
    state: directory
    mode: "0755"

- name: Install the scan-to-share script
  template:
    src: scan-to-share.sh.j2
    dest: /etc/scanbd/scripts/scan-to-share.sh
    mode: "0755"

- name: Configure scanbd
  template:
    src: scanbd.conf.j2
    dest: /etc/scanbd/scanbd.conf
    mode: "0644"

# scanbd runs button scripts as the `saned` user; add it to the scan group so
# scans can be written into the setgid share directory.
- name: Allow the saned user to write to the scan share
  command:
    cmd: "sh -c 'id -nG saned | tr \" \" \"\\n\" | grep -qx {{ scan_group }} || usermod -aG {{ scan_group }} saned'"

# --- Network pull scanning (saned) -------------------------------------------
- name: Configure saned allowed hosts
  template:
    src: saned.conf.j2
    dest: /etc/sane.d/saned.conf
    mode: "0644"

# scanbd exists only to trigger scans from the printer's physical button, but
# the DCP-1510's button can't drive the Pi (Brother's button daemon is x86-only
# and the SANE backend exposes no button option), so scanbd is dead weight here.
# Disable and mask it. The scan-to-share.sh script it would have called remains
# installed for manual/scripted use; network scanning is served by AirSane.
- name: Disable scanbd (physical-button scanning unsupported on this hardware)
  systemd:
    name: scanbd
    state: stopped
    enabled: false
    masked: true

# The packaged saned.socket stays masked: network scanning is handled by AirSane
# (eSCL), not classic SANE-net, so nothing should bind saned's port.
- name: Disable the standalone saned.socket (AirSane handles network scanning)
  systemd:
    name: saned.socket
    state: stopped
    enabled: false
    masked: true

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for SANE net from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ local_subnet }}"
    destination_port: "{{ saned_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: saned"
    persist: true

# --- AirSane: eSCL/AirScan server for macOS/iOS/Windows discovery ------------
# Built from source and run as the saned user (covered by the scanner udev
# rule). Publishes over the Avahi daemon the print role already enables.
- name: Install AirSane build dependencies
  apt:
    name: "{{ airsane_build_packages }}"
    state: present
    update_cache: true
  when: airsane_enabled

- name: Render the AirSane installer
  template:
    src: install-airsane.sh.j2
    dest: /usr/local/sbin/install-airsane.sh
    mode: "0755"
  when: airsane_enabled

- name: Build and install AirSane from source
  command:
    cmd: /usr/local/sbin/install-airsane.sh
  when: airsane_enabled

- name: Ensure AirSane (airsaned) is running and enabled
  systemd:
    name: airsaned
    state: started
    enabled: true
    daemon_reload: true
  when: airsane_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for AirSane (eSCL) from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ local_subnet }}"
    destination_port: "{{ airsane_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: airsane escl"
    persist: true
  when: airsane_enabled

# --- Scan-to-share web UI ----------------------------------------------------
# A tiny stdlib-Python web app: a Scan button that runs the reliable server-side
# scan and drops a PDF into the share. Runs as scan_web_user.
- name: Create the scan-web install directory
  file:
    path: /usr/local/lib/scan-web
    state: directory
    mode: "0755"
  when: scan_web_enabled

- name: Install the scan-web server
  template:
    src: scan-web.py.j2
    dest: /usr/local/lib/scan-web/scan-web.py
    mode: "0755"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Install the scan-web systemd unit
  template:
    src: scan-web.service.j2
    dest: /etc/systemd/system/scan-web.service
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Ensure scan-web is running and enabled
  systemd:
    name: scan-web
    state: started
    enabled: true
    daemon_reload: true
  when: scan_web_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for the scan-web UI from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ local_subnet }}"
    destination_port: "{{ scan_web_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: web ui"
    persist: true
  when: scan_web_enabled
