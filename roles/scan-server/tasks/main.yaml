# Scan server for the USB Brother DCP-1511. Brother's real brscan4 driver (x86)
# runs under i386 emulation in a chroot; scan-web scans through it directly and
# drops PDFs into the share, while AirSane reaches it over a localhost saned net
# bridge for native macOS/iOS discovery.
#
# Overridable variables: see defaults/main.yaml. Depends on `base` (local_subnet,
# firewall) and `scan-share` (scan_dir, scan_group, scan_web_user must exist).

- name: Install host scan packages (SANE, img2pdf, ImageMagick, qemu/debootstrap)
  apt:
    name: "{{ scan_packages }}"
    state: present
    update_cache: true

# --- Brother brscan4 under i386 emulation ------------------------------------
- name: Render the brscan4 emulation installer
  template:
    src: install-brscan4-emu.sh.j2
    dest: /usr/local/sbin/install-brscan4-emu.sh
    mode: "0755"

# Builds the i386 chroot (debootstrap) and installs Brother's driver. Slow on
# the first run (~a few minutes); a no-op once the chroot is ready.
- name: Build the brscan4 emulation chroot
  command:
    cmd: /usr/local/sbin/install-brscan4-emu.sh

# --- Scan pipeline (scan-web scans in the chroot directly) -------------------
- name: Create the scan-web / helper directory
  file:
    path: /usr/local/lib/scan-web
    state: directory
    mode: "0755"

- name: Install the PNM padder
  template:
    src: pad_pnm.py.j2
    dest: /usr/local/lib/scan-web/pad_pnm.py
    mode: "0644"

- name: Install the scan-to-share script
  template:
    src: scan-to-share.sh.j2
    dest: /usr/local/lib/scan-web/scan-to-share.sh
    mode: "0755"

# Thumbnails + DPI/mode sidecars for the web UI's table, kept out of the share.
# A command (not the file module) so it's reliably chowned to the scans user.
- name: Create the scan-web data directory (thumbnails + metadata)
  command:
    cmd: "sh -c 'mkdir -p /var/lib/scan-web/thumbs /var/lib/scan-web/meta && chown -R {{ scan_web_user }}:{{ scan_group }} /var/lib/scan-web'"

- name: Install the chroot bind-mount unit
  template:
    src: brscan-mounts.service.j2
    dest: /etc/systemd/system/brscan-mounts.service
    mode: "0644"

- name: Enable the chroot bind mounts
  systemd:
    name: brscan-mounts.service
    state: started
    enabled: true
    daemon_reload: true

# --- AirSane net bridge (chroot saned on localhost:saned_port) ----------------
# Free saned's port from anything that squats it (sane-utils' saned.socket;
# scanbd's scanbm/scanbd sockets; inetd) so our chroot saned can bind it.
- name: Free saned's port (mask units that bind it)
  command:
    cmd: "sh -c 'systemctl mask --now saned.socket saned@.service scanbm.socket scanbd.socket scanbd.service openbsd-inetd inetd 2>/dev/null; true'"

- name: Install the chroot saned socket + service
  template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "brscan-saned.socket.j2", dest: "brscan-saned.socket" }
    - { src: "brscan-saned@.service.j2", dest: "brscan-saned@.service" }

- name: Point host SANE at the chroot saned (net backend only)
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "host-dll.conf.j2", dest: "/etc/sane.d/dll.conf" }
    - { src: "host-net.conf.j2", dest: "/etc/sane.d/net.conf" }

- name: Enable the chroot saned socket
  systemd:
    name: brscan-saned.socket
    state: started
    enabled: true
    daemon_reload: true

# --- AirSane (eSCL/AirScan server) -------------------------------------------
- name: Install AirSane build dependencies
  apt:
    name: "{{ airsane_build_packages }}"
    state: present
    update_cache: true
  when: airsane_enabled

- name: Render the AirSane installer
  template:
    src: install-airsane.sh.j2
    dest: /usr/local/sbin/install-airsane.sh
    mode: "0755"
  when: airsane_enabled

- name: Build and install AirSane from source
  command:
    cmd: /usr/local/sbin/install-airsane.sh
  when: airsane_enabled

- name: Ensure AirSane (airsaned) is running and enabled
  systemd:
    name: airsaned
    state: started
    enabled: true
    daemon_reload: true
  when: airsane_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for AirSane (eSCL) from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ local_subnet }}"
    destination_port: "{{ airsane_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: airsane escl"
    persist: true
  when: airsane_enabled

# --- Scan-to-share web UI ----------------------------------------------------
- name: Install the scan-web server
  template:
    src: scan-web.py.j2
    dest: /usr/local/lib/scan-web/scan-web.py
    mode: "0755"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Install the scan-web systemd unit
  template:
    src: scan-web.service.j2
    dest: /etc/systemd/system/scan-web.service
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Ensure scan-web is running and enabled
  systemd:
    name: scan-web
    state: started
    enabled: true
    daemon_reload: true
  when: scan_web_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for the scan-web UI from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ local_subnet }}"
    destination_port: "{{ scan_web_port }}"
    jump: ACCEPT
    action: insert
    comment: "scan: web ui"
    persist: true
  when: scan_web_enabled

# --- Retention: hourly cleanup of old scans ----------------------------------
- name: Install the scan cleanup script
  template:
    src: scan-cleanup.sh.j2
    dest: /usr/local/sbin/scan-cleanup.sh
    mode: "0755"
  when: scan_cleanup_enabled

- name: Schedule the hourly scan cleanup
  cron:
    name: scan-cleanup
    job: /usr/local/sbin/scan-cleanup.sh
    minute: "17"
    user: root
    cron_file: /etc/cron.d/scan-cleanup
    state: "{{ 'present' if scan_cleanup_enabled else 'absent' }}"
