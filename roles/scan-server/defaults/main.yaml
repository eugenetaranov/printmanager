# Host packages for scanning. Brother's real driver runs inside an i386 chroot
# (qemu-user-static + debootstrap), so the host only needs: sane-utils (saned,
# for the AirSane net bridge), img2pdf + imagemagick (PNM->JPEG->PDF), and the
# emulation toolchain.
scan_packages:
  - sane-utils
  - img2pdf
  - imagemagick
  - poppler-utils      # pdftoppm: thumbnails for the web UI's table
  - qemu-user-static
  - binfmt-support
  - debootstrap

# --- Brother brscan4 under i386 emulation ------------------------------------
# The DCP-1510's scanner needs Brother's proprietary brscan4 driver. Brother
# ships x86 only, and the reverse-engineered open-source backend can't reliably
# drive this unit (corrupt/blank scans). So we run Brother's REAL driver in a
# small i386 Debian chroot via qemu-user-static — it produces pixel-perfect
# scans. `brscan4_deb_url` is Brother's current i386 .deb (find a fresh link on
# support.brother.com if it 404s).
brscan4_chroot: /opt/brscan4
brscan4_deb_url: "https://download.brother.com/welcome/dlf105201/brscan4-0.4.11-1.i386.deb"
brscan4_suite: bookworm
brscan4_mirror: "http://deb.debian.org/debian"

# --- AirSane: publish the scanner to macOS/iOS/Windows via AirScan/eSCL -------
# Advertises the scanner over mDNS as an eSCL device (native Apple Image Capture
# / iOS). It reaches Brother's driver through the chroot saned net bridge on
# saned_port. NOTE: the net path can truncate at high DPI (Brother short-reads
# the last row); scan-web (below) is the robust path and pads around that.
airsane_enabled: true
airsane_git_url: "https://github.com/SimulPiscator/AirSane.git"
airsane_git_ref: "master"
airsane_port: 8090
airsane_build_packages:
  - git
  - cmake
  - g++
  - libsane-dev
  - libjpeg-dev
  - libpng-dev
  - libavahi-client-dev
  - libusb-1.0-0-dev

# Scan output settings. scan_mode must be one of brscan4's exact names:
# "24bit Color", "True Gray", "Gray[Error Diffusion]", "Black & White".
scan_resolution: 300
scan_mode: "24bit Color"

# JPEG quality used inside the PDF. 92 with no chroma subsampling keeps text
# edges crisp (q80 4:2:0 produces a diagonal sawtooth on black text). A 300 DPI
# colour page is ~1-2 MB at 92. Lower to ~80 for smaller files, raise for photos.
scan_jpeg_quality: 92

# --- Scan-to-share web UI ----------------------------------------------------
# A dependency-free stdlib-Python page with a Scan button that runs the scan
# server-side (Brother's driver in the chroot) and drops a PDF into the share.
# Reachable from any LAN browser/phone. On port 80 -> http://<pi>/.
scan_web_enabled: true
scan_web_port: 80
scan_web_user: scans
scan_web_title: printmanager
scan_web_share: "smb://printmanager.local/scans"

# saned port for the AirSane net bridge (chroot saned on 127.0.0.1:this).
saned_port: 6566

# Must match the scan-share role (where scans land, and the owning group).
scan_dir: /srv/scans
scan_group: scans

# Auto-delete scans (and their thumbnails/metadata) older than this many hours,
# via an hourly cron job. Set scan_cleanup_enabled false to keep scans forever.
scan_cleanup_enabled: true
scan_retention_hours: 24
