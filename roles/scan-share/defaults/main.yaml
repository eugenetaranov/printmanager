# Samba packages. samba-vfs-modules provides the catia/fruit/streams_xattr VFS
# modules used for macOS (Finder) interop in smb.conf — without them smbd fails
# to load the share and macOS copies fail with "error code -51".
share_packages:
  - samba
  - samba-vfs-modules

# Shared settings owned by this role (scan-server and web-ui read them too).
# Tack merges every role's defaults into one namespace, so declare them only
# here and override them in site.yaml `vars:` (see `task check-vars`).

# Destination directory scans are written to and the [scans] share exposes.
scan_dir: /srv/scans

# System group owning the scan dir; both the scan process and the Samba user
# are members so files written by either are readable by the other. The dir is
# setgid so new files inherit this group.
scan_group: scans

# System user that owns the scan dir: Samba clients authenticate as it, and
# the web UI (scan-web) and its scan pipeline run as it.
scan_user: scans

# Allow unauthenticated (guest) access to the [scans] share. When true, clients
# reach the share without a password, mapped to scan_user (the owner of
# scan_dir) so they can read and write scans. Suitable for a trusted LAN, where
# access is already restricted to the LAN subnet by hosts allow/deny. Set false
# to require the Samba password below instead.
scan_samba_guest: true

# Samba password for scan_user. This is a SECRET — leave empty here and
# supply it from encrypted vars / a vault at run time. When empty, the Samba
# password is left unset (task skipped) and you must set it manually with
# `smbpasswd -a scans` on the host. Only relevant when scan_samba_guest is false.
scan_samba_password: ""

# Samba workgroup / server identification.
samba_workgroup: WORKGROUP
samba_server_string: Print/Scan Server
