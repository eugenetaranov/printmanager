# Validates settings shared between roles before any role changes the host.
# Runs first in site.yaml, tagged `always`, so every --tags run passes through
# it. Every task is a guard that only exits 1 when its `when:` holds — nothing
# on the host is touched. (Tack has no assert/fail module.)
#
# The shared settings are declared once, in the role that owns them; see
# `task check-vars`.

- name: Reject an unknown scan_backend
  command:
    cmd: >-
      sh -c 'echo "scan_backend must be brscan4-emu or escl, got: {{ scan_backend }}" >&2; exit 1'
  when: scan_backend != "brscan4-emu" and scan_backend != "escl"

# The web UI's print queue defaults to the printers: entry marked default.
# Tack has no list filters, so count the `default:true` pairs in the list's
# rendered form ([map[default:true name:X] ...]).
- name: Require exactly one default printer when the print queue is derived
  command:
    cmd: >-
      sh -c 'n=$(printf "%s" "{{ printers }}" | grep -o "default:true" | wc -l | tr -d " "); [ "$n" -eq 1 ] || { echo "exactly one printers entry must set default true (found $n), or set scan_web_print_queue" >&2; exit 1; }'
  when: scan_web_print_enabled and scan_web_print_queue == ""

- name: Reject renamed settings (scan_samba_user, scan_web_user -> scan_user)
  command:
    cmd: >-
      sh -c 'echo "scan_samba_user / scan_web_user were merged into scan_user — rename the override in site.yaml vars" >&2; exit 1'
  when: scan_samba_user is defined or scan_web_user is defined

- name: Reject renamed settings (scan_brscan4_enabled, scan_escl_enabled -> scan_backend)
  command:
    cmd: >-
      sh -c 'echo "scan_brscan4_enabled / scan_escl_enabled were replaced by scan_backend (brscan4-emu or escl) — rename the override in site.yaml vars" >&2; exit 1'
  when: scan_brscan4_enabled is defined or scan_escl_enabled is defined
