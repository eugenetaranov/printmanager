# Base host preparation for the print/scan server: common packages and a
# default-deny firewall baseline (iptables/ip6tables). Runs first so later roles
# can assume iptables-persistent + usbutils exist and just INSERT their own
# ACCEPT rules above the trailing DROP this role appends.
#
# Required/overridable variables live in defaults/main.yaml:
#   base_packages, base_firewall_enabled, base_ssh_port,
#   base_ensure_updates_pocket

# Runs before the package install below so its `update_cache` refresh picks up
# the newly-enabled pocket. Idempotent: once `<codename>-updates` is present the
# sed no longer matches. No-op on non-deb822 hosts (file guard). See the default
# for why a missing -updates pocket breaks installs ("held broken packages").
- name: Ensure the release-updates apt pocket is enabled
  command:
    cmd: >
      sh -c 'f=/etc/apt/sources.list.d/ubuntu.sources;
      [ -f "$f" ] || exit 0;
      . /etc/os-release;
      grep -qE "^Suites:.*${VERSION_CODENAME}-updates" "$f" && exit 0;
      sed -i "s/^Suites: ${VERSION_CODENAME}$/Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates/" "$f"'
  when: base_ensure_updates_pocket

- name: Install common base packages
  apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true

# Generate en_US.UTF-8 so SSH sessions that forward LANG/LC_* don't warn
# "cannot change locale". Portable across Ubuntu and Raspberry Pi OS/Debian:
# Debian's locale-gen IGNORES a CLI locale argument and only (re)generates the
# entries enabled in /etc/locale.gen, so we enable the entry there and then run
# locale-gen with no args (works on Ubuntu too). Idempotent (early-exits once
# the locale exists) and best-effort (cosmetic, never fails the play).
- name: Ensure the en_US.UTF-8 locale exists
  command:
    cmd: >
      sh -c 'locale -a 2>/dev/null | grep -qiE "^en_US\.utf-?8$" && exit 0;
      apt-get install -y locales >/dev/null 2>&1 || true;
      if [ -f /etc/locale.gen ]; then
      sed -i "s/^# *\(en_US\.UTF-8 UTF-8\)/\1/" /etc/locale.gen;
      grep -qiE "^en_US\.UTF-8 UTF-8" /etc/locale.gen || echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen;
      fi;
      locale-gen >/dev/null 2>&1 || locale-gen en_US.UTF-8 >/dev/null 2>&1 || true;
      update-locale LANG=en_US.UTF-8 >/dev/null 2>&1 || true;
      exit 0'

# --- Firewall: default-deny baseline (iptables; restored on boot by ------------
# iptables-persistent) ---------------------------------------------------------
# Allow rules are appended first (so they sit above the DROP), SSH included,
# BEFORE the default-deny rule is added -- this is what prevents a lockout.
# Service roles run after base and INSERT their own ACCEPT rules, which land
# above this DROP regardless of run order.
- name: Allow loopback traffic (IPv4)
  iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    comment: "base: loopback"
    persist: true
  when: base_firewall_enabled

- name: Allow established/related connections (IPv4)
  iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "base: established"
    persist: true
  when: base_firewall_enabled

- name: Allow SSH (IPv4)
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ base_ssh_port }}"
    jump: ACCEPT
    comment: "base: ssh"
    persist: true
  when: base_firewall_enabled

# Allow ICMP (ping/diagnostics). Uses action: insert (like the service roles) so
# it lands ABOVE the default-deny DROP even when re-applied to an already-
# provisioned host; echo-replies to our own pings return via established/related.
- name: Allow ICMP (IPv4)
  iptables:
    chain: INPUT
    protocol: icmp
    jump: ACCEPT
    action: insert
    comment: "base: icmp"
    persist: true
  when: base_firewall_enabled

- name: Default-deny incoming (IPv4)
  iptables:
    chain: INPUT
    jump: DROP
    comment: "base: default-deny"
    persist: true
  when: base_firewall_enabled

# IPv6 gets the same baseline so v6 isn't left wide open. No LAN service ports
# here -- the LAN is IPv4 -- but SSH and the established/loopback allowances keep
# the host reachable and self-consistent.
- name: Allow loopback traffic (IPv6)
  iptables:
    chain: INPUT
    ip_version: ipv6
    in_interface: lo
    jump: ACCEPT
    comment: "base: loopback"
    persist: true
  when: base_firewall_enabled

- name: Allow established/related connections (IPv6)
  iptables:
    chain: INPUT
    ip_version: ipv6
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "base: established"
    persist: true
  when: base_firewall_enabled

- name: Allow SSH (IPv6)
  iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ base_ssh_port }}"
    jump: ACCEPT
    comment: "base: ssh"
    persist: true
  when: base_firewall_enabled

# ICMPv6 is not just ping -- it carries Neighbor Discovery / RA, so IPv6 needs it
# to work at all. action: insert so it lands above the v6 DROP on re-apply too.
- name: Allow ICMPv6 (IPv6)
  iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: ipv6-icmp
    jump: ACCEPT
    action: insert
    comment: "base: icmpv6"
    persist: true
  when: base_firewall_enabled

- name: Default-deny incoming (IPv6)
  iptables:
    chain: INPUT
    ip_version: ipv6
    jump: DROP
    comment: "base: default-deny"
    persist: true
  when: base_firewall_enabled

# --- Wi-Fi power saving off (stops the brcmfmac link dropping) ----------------
- name: Ensure the NetworkManager drop-in dir exists
  file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"
  when: base_wifi_powersave_off

- name: Disable Wi-Fi power saving in NetworkManager (persists across reconnects)
  template:
    src: wifi-powersave-off.conf.j2
    dest: /etc/NetworkManager/conf.d/wifi-powersave-off.conf
    mode: "0644"
  when: base_wifi_powersave_off

- name: Install the Wi-Fi power-save-off service (universal + immediate)
  template:
    src: wifi-powersave-off.service.j2
    dest: /etc/systemd/system/wifi-powersave-off.service
    mode: "0644"
  when: base_wifi_powersave_off

# Enabling + starting runs `iw ... power_save off` now (immediate effect) and on
# every boot; the NM drop-in keeps it off across wifi reconnects.
- name: Enable and start the Wi-Fi power-save-off service
  systemd:
    name: wifi-powersave-off.service
    state: started
    enabled: true
    daemon_reload: true
  when: base_wifi_powersave_off
