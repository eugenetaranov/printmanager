# Services (SMB, CUPS/IPP, AirSane eSCL, web UI) are reachable from ANY network,
# not just the LAN subnet — the host roams across wifis and clients connect from
# whatever network they're on. Firewall openings and app ACLs (Samba hosts allow,
# cupsd Allow) are unscoped; access is gated by service auth, not source IP.
# (tack still gathers the default interface CIDR as the `default_ipv4_subnet`
# fact — referenced in templates as `{{ .facts.default_ipv4_subnet }}` — but no
# role scopes to it anymore. Reintroduce that source filter to re-restrict.)

# Packages shared across roles. usbutils gives lsusb for identifying the
# Brother's USB VID/PID; iptables-persistent restores the rules the firewall
# tasks write (via `persist: true`) across reboots.
base_packages:
  - ca-certificates
  - curl
  - usbutils
  - iptables-persistent
  - iw

# Ensure the `<codename>-updates` apt pocket is enabled before installing
# packages. Ubuntu ships it on by default; if it has been removed, installed
# -updates point releases (e.g. libacl1) conflict with the older -release
# versions and apt reports "held broken packages". Set false to leave apt
# sources untouched.
base_ensure_updates_pocket: true

# Manage the firewall (default-deny incoming via iptables). Set false to leave
# the firewall untouched.
base_firewall_enabled: true

# SSH port allowed before the default-deny DROP rule is added (prevents lockout).
base_ssh_port: 22

# Disable Wi-Fi power saving. On the Pi's brcmfmac radio, power-save causes the
# link to briefly drop/stall (the host goes unreachable for seconds, breaks mDNS
# + long SSH), so we turn it off. Two mechanisms for portability across Ubuntu /
# Raspberry Pi OS: a NetworkManager global drop-in (applies on every wifi
# (re)connect where NM manages the link) and a systemd oneshot running `iw`
# (immediate + covers non-NM setups). Set false to leave power management alone.
base_wifi_powersave_off: true
base_wifi_iface: wlan0
