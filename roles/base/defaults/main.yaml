# The LAN subnet permitted to reach the print/scan/share services is discovered,
# not hardcoded: tack gathers the default interface's network CIDR as the fact
# `default_ipv4_subnet` (e.g. 192.168.1.0/24). Firewall rules and task values use
# it as `{{ facts.default_ipv4_subnet }}`; templates (.j2, Go text/template) use
# `{{ .facts.default_ipv4_subnet }}` (leading dot, `facts` sub-map). There is no
# local_subnet var — a var whose value is itself a template wouldn't expand
# (single-pass render), so the fact is referenced directly everywhere.

# Packages shared across roles. usbutils gives lsusb for identifying the
# Brother's USB VID/PID; iptables-persistent restores the rules the firewall
# tasks write (via `persist: true`) across reboots.
base_packages:
  - ca-certificates
  - curl
  - usbutils
  - iptables-persistent

# Ensure the `<codename>-updates` apt pocket is enabled before installing
# packages. Ubuntu ships it on by default; if it has been removed, installed
# -updates point releases (e.g. libacl1) conflict with the older -release
# versions and apt reports "held broken packages". Set false to leave apt
# sources untouched.
base_ensure_updates_pocket: true

# Manage the firewall (default-deny incoming via iptables). Set false to leave
# the firewall untouched.
base_firewall_enabled: true

# SSH port allowed before the default-deny DROP rule is added (prevents lockout).
base_ssh_port: 22
