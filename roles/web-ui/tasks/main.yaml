# printmanager web UI (Scan + Print). Serves the stdlib-Python app on port 80 as
# the unprivileged scans user (CAP_NET_BIND_SERVICE). Shells out to the scan
# pipeline (scan-server) and the CUPS queue (print-server), so it runs after
# both. Overridable variables: see defaults/main.yaml.

- name: Install web UI packages (reportlab, Pillow, poppler, CUPS client)
  apt:
    name: "{{ web_packages }}"
    state: present
    update_cache: true
  when: scan_web_enabled

# Shared with scan-server, which also drops the scan pipeline scripts here.
# Ensured independently so this role does not rely on run order for the path.
- name: Ensure the web app directory exists
  file:
    path: /usr/local/lib/scan-web
    state: directory
    mode: "0755"
  when: scan_web_enabled

# scan-web.py is a plain Python file (no templating) installed verbatim; its
# config comes from the rendered YAML below (SCAN_WEB_CONFIG), not from the code.
- name: Install the scan-web server
  copy:
    src: scan-web.py
    dest: /usr/local/lib/scan-web/scan-web.py
    mode: "0755"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Render the scan-web config (loaded by scan-web.py)
  template:
    src: scan-web-config.yaml.j2
    dest: /usr/local/lib/scan-web/config.yaml
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

# --- React SPA (built on the target from this repo) -------------------------
# scan-web.py serves the built SPA from scan_web_ui_dir when present, else the
# embedded HTML — so a failed/absent build never takes the UI down.
- name: Install SPA build tooling (curl, xz)
  apt:
    name: [curl, xz-utils, ca-certificates]
    state: present
  when: scan_web_enabled and scan_web_spa

- name: Install the Node.js bootstrap script
  template:
    src: install-node.sh.j2
    dest: /usr/local/lib/scan-web/install-node.sh
    mode: "0755"
  when: scan_web_enabled and scan_web_spa

- name: Install a pinned Node.js for the build
  command: /usr/local/lib/scan-web/install-node.sh
  when: scan_web_enabled and scan_web_spa

# The SPA source is uploaded from this repo's local working tree (not cloned
# from GitHub), so a deploy ships whatever is checked out here — no push/pull
# round-trip. Run tack from the repo root: the copy `src` paths below resolve
# relative to the working directory. node_modules/ and dist/ are deliberately
# not referenced, so they're never uploaded (npm ci rebuilds node_modules on
# the target). The src/ sync uses delete:true to also drop files removed here.
- name: Ensure the web-UI build directory exists
  file:
    path: "{{ web_ui_build_dir }}"
    state: directory
    mode: "0755"
  when: scan_web_enabled and scan_web_spa

- name: Upload the web-UI src/ tree
  copy:
    src: web-ui-src/src
    dest: "{{ web_ui_build_dir }}/web-ui-src"
    delete: true
  when: scan_web_enabled and scan_web_spa

- name: Upload the web-UI build inputs (manifests, Vite + TS config, entry HTML)
  copy:
    src: "web-ui-src/{{ item }}"
    dest: "{{ web_ui_build_dir }}/web-ui-src/{{ item }}"
    create_dirs: true
  loop:
    - index.html
    - package.json
    - package-lock.json
    - vite.config.ts
    - tsconfig.json
    - tsconfig.app.json
    - tsconfig.node.json
  when: scan_web_enabled and scan_web_spa

# Older deploys git-cloned the whole repo into web_ui_build_dir, leaving a stale
# .git (and repo files) behind. Since the SPA is now built from uploaded files
# (no checkout), `git describe` during the build walked up into that stale .git
# and reported a wrong, always-"-dirty" commit. Remove the leftovers so the build
# dir holds only the uploaded source and the version resolves cleanly to 'dev'.
# A plain rm (under the play's sudo) rather than file:absent or a `removes`
# guard: the build-dir leftovers are root-owned, and tack's remote existence
# check runs as the login user and misreports them absent — which would skip the
# cleanup. An unguarded `rm -rf` is idempotent (harmless when already gone), so
# it always runs and reliably clears the stale clone. chdir scopes it to the
# build dir. Once cleared, `git describe` in the build finds no repo → 'dev'.
- name: Remove the stale git clone left in the build dir
  command:
    cmd: "rm -rf .git roles docs openspec site.yaml README.md .gitignore"
    chdir: "{{ web_ui_build_dir }}"
    changed_when: "false"
  when: scan_web_enabled and scan_web_spa

- name: Install the SPA build script
  template:
    src: build-webui.sh.j2
    dest: /usr/local/lib/scan-web/build-webui.sh
    mode: "0755"
  when: scan_web_enabled and scan_web_spa

- name: Build the SPA (npm ci && vite build)
  command: /usr/local/lib/scan-web/build-webui.sh
  when: scan_web_enabled and scan_web_spa
  notify: Restart scan-web

# --- Devices tab: Niimbot BLE label printers -------------------------------
# Installed alongside scan-web.py and imported lazily (like reportlab/Pillow),
# so the base app is unaffected when the Devices tab is off.
- name: Install the Niimbot BLE module
  copy:
    src: niimbot.py
    dest: /usr/local/lib/scan-web/niimbot.py
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

# Create the venv scan-web runs from (always, since the unit's ExecStart points
# at it) and install bleak/qrcode into it when the Devices tab is enabled.
- name: Install the venv bootstrap script
  template:
    src: install-niimbot-venv.sh.j2
    dest: /usr/local/lib/scan-web/install-niimbot-venv.sh
    mode: "0755"
  when: scan_web_enabled

- name: Create the scan-web venv and install BLE deps
  command: /usr/local/lib/scan-web/install-niimbot-venv.sh
  when: scan_web_enabled
  notify: Restart scan-web

# BlueZ must be running for the BLE path; enabling the service is harmless on a
# host with no adapter (the UI reports "Bluetooth unavailable" at runtime).
- name: Ensure Bluetooth (BlueZ) is enabled
  systemd:
    name: bluetooth
    state: started
    enabled: true
  when: scan_web_enabled and scan_web_devices_enabled

# Let the unprivileged scan-web user drive org.bluez on the system bus.
- name: Install the BlueZ D-Bus policy for the scan-web user
  template:
    src: scan-web-bluez.conf.j2
    dest: /etc/dbus-1/system.d/scan-web-bluez.conf
    mode: "0644"
  when: scan_web_enabled and scan_web_devices_enabled
  notify: Reload dbus

- name: Install the scan-web systemd unit
  template:
    src: scan-web.service.j2
    dest: /etc/systemd/system/scan-web.service
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Ensure scan-web is running and enabled
  systemd:
    name: scan-web
    state: started
    enabled: true
    daemon_reload: true
  when: scan_web_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for the web UI from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ facts.default_ipv4_subnet }}"
    destination_port: "{{ scan_web_port }}"
    jump: ACCEPT
    action: insert
    comment: "web: scan+print ui"
    persist: true
  when: scan_web_enabled
