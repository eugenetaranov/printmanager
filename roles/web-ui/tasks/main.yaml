# printmanager web UI (Scan + Print). Serves the stdlib-Python app on port 80 as
# the unprivileged scans user (CAP_NET_BIND_SERVICE). Shells out to the scan
# pipeline (scan-server) and the CUPS queue (print-server), so it runs after
# both. Overridable variables: see defaults/main.yaml.

- name: Install web UI packages (reportlab, Pillow, poppler, CUPS client)
  apt:
    name: "{{ web_packages }}"
    state: present
    update_cache: true
  when: scan_web_enabled

# Shared with scan-server, which also drops the scan pipeline scripts here.
# Ensured independently so this role does not rely on run order for the path.
- name: Ensure the web app directory exists
  file:
    path: /usr/local/lib/scan-web
    state: directory
    mode: "0755"
  when: scan_web_enabled

- name: Install the scan-web server
  template:
    src: scan-web.py.j2
    dest: /usr/local/lib/scan-web/scan-web.py
    mode: "0755"
  when: scan_web_enabled
  notify: Restart scan-web

# --- Devices tab: Niimbot BLE label printers -------------------------------
# Installed alongside scan-web.py and imported lazily (like reportlab/Pillow),
# so the base app is unaffected when the Devices tab is off.
- name: Install the Niimbot BLE module
  copy:
    src: niimbot.py
    dest: /usr/local/lib/scan-web/niimbot.py
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

# Create the venv scan-web runs from (always, since the unit's ExecStart points
# at it) and install bleak/qrcode into it when the Devices tab is enabled.
- name: Install the venv bootstrap script
  template:
    src: install-niimbot-venv.sh.j2
    dest: /usr/local/lib/scan-web/install-niimbot-venv.sh
    mode: "0755"
  when: scan_web_enabled

- name: Create the scan-web venv and install BLE deps
  command: /usr/local/lib/scan-web/install-niimbot-venv.sh
  when: scan_web_enabled
  notify: Restart scan-web

# BlueZ must be running for the BLE path; enabling the service is harmless on a
# host with no adapter (the UI reports "Bluetooth unavailable" at runtime).
- name: Ensure Bluetooth (BlueZ) is enabled
  systemd:
    name: bluetooth
    state: started
    enabled: true
  when: scan_web_enabled and scan_web_devices_enabled

# Let the unprivileged scan-web user drive org.bluez on the system bus.
- name: Install the BlueZ D-Bus policy for the scan-web user
  template:
    src: scan-web-bluez.conf.j2
    dest: /etc/dbus-1/system.d/scan-web-bluez.conf
    mode: "0644"
  when: scan_web_enabled and scan_web_devices_enabled
  notify: Reload dbus

- name: Install the scan-web systemd unit
  template:
    src: scan-web.service.j2
    dest: /etc/systemd/system/scan-web.service
    mode: "0644"
  when: scan_web_enabled
  notify: Restart scan-web

- name: Ensure scan-web is running and enabled
  systemd:
    name: scan-web
    state: started
    enabled: true
    daemon_reload: true
  when: scan_web_enabled

# Inserted above the base default-deny DROP (see the base role).
- name: Open the firewall for the web UI from the LAN
  iptables:
    chain: INPUT
    protocol: tcp
    source: "{{ facts.default_ipv4_subnet }}"
    destination_port: "{{ scan_web_port }}"
    jump: ACCEPT
    action: insert
    comment: "web: scan+print ui"
    persist: true
  when: scan_web_enabled
